name: NativeRelay Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: Windows NativeRelay Test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NativeRelay 0.4.0 from PyPI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "nativerelay==0.4.0"
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          Add-Content $env:GITHUB_PATH $scripts
          $installed = python -c "from importlib.metadata import version; print(version('nativerelay'))"
          if ($installed -ne "0.4.0") { throw "Unexpected NativeRelay version: $installed" }
          if (-not (Test-Path (Join-Path $scripts "nativerelay.exe"))) { throw "nativerelay.exe missing from Python Scripts directory" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build AgentTrace
        run: cargo build --locked

      - name: Run NativeRelay live integration test
        shell: pwsh
        run: |
          $agenttrace = Join-Path $env:GITHUB_WORKSPACE "target\debug\agenttrace.exe"
          $testDir = Join-Path $env:RUNNER_TEMP ("agenttrace-native-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testDir | Out-Null
          $history = Join-Path $testDir "history.jsonl"
          $stdout = Join-Path $testDir "agenttrace.stdout"
          $stderr = Join-Path $testDir "agenttrace.stderr"
          $activity = Join-Path $env:GITHUB_WORKSPACE ".nativerelay-integration-activity-$PID.txt"
          $p = Start-Process -FilePath $agenttrace -ArgumentList @("run", "--native-relay", "--json", "--output", $history) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 100; $i++) {
              if ($p.HasExited) { throw "AgentTrace exited before NativeRelay started. $((Get-Content $stderr -Raw -ErrorAction SilentlyContinue))" }
              if (Test-Path $history) {
                $records = @(Get-Content $history | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} })
                $status = $records | Where-Object { $_.event_type -eq "native_relay.status" -and $_.data.native_record.state -in @("running", "degraded") } | Select-Object -First 1
                if ($status) { $ready = $true; break }
              }
              Start-Sleep -Milliseconds 200
            }
            if (-not $ready) { throw "NativeRelay did not report running/degraded status. $((Get-Content $stderr -Raw -ErrorAction SilentlyContinue))" }

            Set-Content -Path $activity -Value "created"
            Start-Sleep -Milliseconds 350
            Set-Content -Path $activity -Value "modified"

            # Toolhelp fallback polls every 200ms; keep this child alive long enough to observe.
            $probe = Start-Process -FilePath "$env:WINDIR\System32\ping.exe" -ArgumentList @("127.0.0.1", "-n", "5") -PassThru
            $targetProcessId = $probe.Id
            $probe.WaitForExit()

            $verified = $false
            for ($i = 0; $i -lt 100; $i++) {
              if (Test-Path $history) {
                $records = @(Get-Content $history | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} })
                $observations = @($records | Where-Object { $_.event_type -eq "native_relay.observation" } | ForEach-Object { $_.data.native_record })
                $created = $observations | Where-Object { $_.type -eq "file.created" -and $_.resource.path -like "*nativerelay-integration-activity-*" }
                $modified = $observations | Where-Object { $_.type -eq "file.modified" -and $_.resource.path -like "*nativerelay-integration-activity-*" }
                $started = $observations | Where-Object { $_.type -eq "process.started" -and $_.process.pid -eq $targetProcessId }
                $exited = $observations | Where-Object { $_.type -eq "process.exited" -and $_.process.pid -eq $targetProcessId }
                if ($created -and $modified -and $started -and $exited) { $verified = $true; break }
              }
              Start-Sleep -Milliseconds 200
            }
            if (-not $verified) {
              Get-Content $stdout, $stderr, $history -ErrorAction SilentlyContinue | Write-Host
              throw "Expected file.created/file.modified and process.started/process.exited observations were not all received."
            }
            Write-Host "Verified NativeRelay Windows file and process observations (PID $targetProcessId)."
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item $activity -Force -ErrorAction SilentlyContinue
            Remove-Item $testDir -Recurse -Force -ErrorAction SilentlyContinue
          }
