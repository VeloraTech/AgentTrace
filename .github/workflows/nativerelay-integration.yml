name: NativeRelay Integration

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nativerelay-linux:
    name: NativeRelay Linux integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NativeRelay 0.3.2
        run: python -m pip install nativerelay==0.3.2
      - name: Run existing test suite
        run: npm test
      - name: Build AgentTrace
        run: cargo build --locked
      - name: Check for root/capabilities
        id: check-root
        run: |
          if [ "$(id -u)" -eq 0 ] || (command -v capsh >/dev/null && capsh --print | grep -q "cap_net_admin\|cap_sys_admin"); then
            echo "has_privileges=true" >> $GITHUB_OUTPUT
          else
            echo "has_privileges=false" >> $GITHUB_OUTPUT
          fi
      - name: Verify NativeRelay integration (full with privileges)
        if: steps.check-root.outputs.has_privileges == 'true'
        run: bash scripts/test-nativerelay-linux.sh
      - name: Verify NativeRelay integration (basic without privileges)
        if: steps.check-root.outputs.has_privileges != 'true'
        run: |
          echo "Running without root/CAP_NET_ADMIN/CAP_SYS_ADMIN - testing basic integration only"
          agenttrace_bin="target/debug/agenttrace"
          test_dir=$(mktemp -d)
          history_file="$test_dir/history.jsonl"
          
          # Test that AgentTrace can start NativeRelay and communicate with it
          timeout 15 "$agenttrace_bin" run --native-relay --json --output "$history_file" &
          pid=$!
          sleep 3
          kill -INT $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          
          # Verify session started and NativeRelay process was spawned
          if grep -q '"event_type":"session_started"' "$history_file" && \
             grep -q '"native_relay":{"enabled":true}' "$history_file"; then
            echo "✅ Basic NativeRelay integration works (process spawn + JSONL communication)"
            exit 0
          else
            echo "❌ NativeRelay integration failed"
            cat "$history_file"
            exit 1
          fi

  nativerelay-windows:
    name: NativeRelay Windows integration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install NativeRelay 0.3.2
        run: python -m pip install nativerelay==0.3.2
      - name: Run existing test suite
        run: npm test
      - name: Build AgentTrace
        run: cargo build --locked
      - name: Verify NativeRelay Windows availability
        run: |
          # NativeRelay collectors not implemented on Windows yet
          # This test verifies AgentTrace handles missing NativeRelay gracefully
          agenttrace_bin="target\\debug\\agenttrace.exe"
          test_dir=$(New-Item -ItemType Directory -Force -Path "$env:TEMP\nativerelay-test").FullName
          history_file="$test_dir\history.jsonl"
          
          # Test without --native-relay (should work)
          & $agenttrace_bin run --json --output "$history_file" &
          $pid = $!
          Start-Sleep -Seconds 2
          Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          
          # Verify session works without NativeRelay
          if (Select-String -Path $history_file -Pattern '"event_type":"session_started"') {
            Write-Host "✅ AgentTrace works on Windows without NativeRelay"
            exit 0
          } else {
            Write-Host "❌ AgentTrace failed on Windows"
            Get-Content $history_file
            exit 1
          }
      - name: Verify NativeRelay missing handling
        run: |
          # Test that --native-relay gives actionable error on Windows
          agenttrace_bin="target\\debug\\agenttrace.exe"
          test_dir=$(New-Item -ItemType Directory -Force -Path "$env:TEMP\nativerelay-test2").FullName
          history_file="$test_dir\history.jsonl"
          
          & $agenttrace_bin run --native-relay --json --output "$history_file" 2>$test_dir\stderr.txt &
          $pid = $!
          Start-Sleep -Seconds 3
          Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          
          $stderr = Get-Content $test_dir\stderr.txt -Raw
          if ($stderr -match "not available on this platform" -or $stderr -match "NativeRelay collector is not available") {
            Write-Host "✅ Correctly reports NativeRelay unavailable on Windows"
            exit 0
          } else {
            Write-Host "❌ Should report NativeRelay unavailable on Windows"
            Write-Host "Stderr: $stderr"
            exit 1
          }
