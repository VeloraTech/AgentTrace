name: NativeRelay Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    name: Windows NativeRelay Test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build AgentTrace
        run: cargo build --locked

      - name: Run NativeRelay integration test
        id: test
        shell: pwsh
        run: |
          $agenttrace_bin = "${{ github.workspace }}\target\debug\agenttrace.exe"
          $test_dir = New-TemporaryFile | ForEach-Object { $_.DirectoryName + "\" + $_.BaseName }
          New-Item -ItemType Directory -Path $test_dir | Out-Null
          $history_file = "$test_dir\history.jsonl"
          $agenttrace_stdout = "$test_dir\agenttrace.stdout"
          $agenttrace_stderr = "$test_dir\agenttrace.stderr"

          # Run agenttrace with native-relay
          $process = Start-Process -FilePath $agenttrace_bin -ArgumentList "run", "--native-relay", "--json", "--output", $history_file -RedirectStandardOutput $agenttrace_stdout -RedirectStandardError $agenttrace_stderr -PassThru
          $agenttrace_pid = $process.Id

          # Wait for session to start and native relay to report running
          $ready = $false
          $agenttrace_process_pid = $null
          $native_pid = $null

          for ($i = 0; $i -lt 80; $i++) {
            if (-not (Get-Process -Id $agenttrace_pid -ErrorAction SilentlyContinue)) {
              Write-Error "AgentTrace exited before NativeRelay reported a running collector."
              Get-Content $agenttrace_stdout, $agenttrace_stderr -ErrorAction SilentlyContinue | Write-Host
              exit 1
            }

            if (Test-Path $history_file) {
              if (-not $agenttrace_process_pid) {
                $session_id = Get-Content $history_file | ConvertFrom-Json | Where-Object { $_.event_type -eq "session_started" } | Select-Object -First 1 -ExpandProperty session_id
                if ($session_id) {
                  $agenttrace_process_pid = $session_id.Split("-")[0]
                }
              }

              $status = Get-Content $history_file | ConvertFrom-Json | Where-Object { $_.event_type -eq "native_relay.status" -and $_.data.native_record.state -eq "running" } | Select-Object -First 1
              if ($status) {
                $ready = $true
                break
              }
            }
            Start-Sleep -Milliseconds 250
          }

          if (-not $ready) {
            Write-Error "NativeRelay did not report a running collector."
            Get-Content $agenttrace_stdout, $agenttrace_stderr, $history_file -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

          # Generate some activity to observe
          $activity_file = "$PWD\.nativerelay-integration-activity-$PID.txt"
          "test" | Out-File -Encoding utf8 $activity_file

          # Probe process
          $probe = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "timeout", "/t", "2" -PassThru
          $probe_pid = $probe.Id
          $probe.WaitForExit()

          # Verify observations
          $verified = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (Test-Path $history_file) {
              $observations = Get-Content $history_file | ConvertFrom-Json | Where-Object { $_.event_type -eq "native_relay.observation" } | Select-Object -ExpandProperty data.native_record
              $file_opened = $observations | Where-Object { $_.type -eq "file.opened" -and $_.resource.path -eq $activity_file }
              $process_started = $observations | Where-Object { $_.type -eq "process.started" -and $_.process.pid -eq $probe_pid }
              $process_exited = $observations | Where-Object { $_.type -eq "process.exited" -and $_.process.pid -eq $probe_pid }

              if ($file_opened -and $process_started -and $process_exited) {
                Write-Host "Verified NativeRelay observations: file.opened, process.started, process.exited (PID $probe_pid)"
                $verified = $true
                break
              }
            }
            Start-Sleep -Milliseconds 250
          }

          if (-not $verified) {
            Write-Error "Timed out waiting for required real observations."
            Get-Content $agenttrace_stdout, $agenttrace_stderr, $history_file -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

          # Stop agenttrace gracefully (send Ctrl+C equivalent)
          $process = Get-Process -Id $agenttrace_pid -ErrorAction SilentlyContinue
          if ($process) {
            # Send Ctrl+C to the process group
            $sigint = [System.Console]::CancelKeyPress
            # Use taskkill with /PID and /T to kill process tree, but first try graceful
            try {
              $process.CloseMainWindow()  # This sends WM_CLOSE, similar to SIGTERM
              $process.WaitForExit(5000)
            } catch {
              Stop-Process -Id $agenttrace_pid -Force -ErrorAction SilentlyContinue
            }
          }
          $exit_code = 0
          try {
            $process = Get-Process -Id $agenttrace_pid -ErrorAction Stop
            $process.WaitForExit()
            $exit_code = $process.ExitCode
          } catch {
            $exit_code = 1
          }

          if ($exit_code -ne 0) {
            Write-Error "AgentTrace exited with status $exit_code after SIGINT."
            Get-Content $agenttrace_stdout, $agenttrace_stderr, $history_file -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

          # Verify session stopped cleanly
          $stopped = Get-Content $history_file | ConvertFrom-Json | Where-Object { $_.event_type -eq "session_stopped" } | Select-Object -Last 1
          $statuses = Get-Content $history_file | ConvertFrom-Json | Where-Object { $_.event_type -eq "native_relay.status" } | Select-Object -ExpandProperty data.native_record

          if (-not $stopped -or $stopped.data.trace_complete -ne $true -or $stopped.data.observations_lost_or_incomplete -ne $false) {
            Write-Error "Session not marked complete: $($stopped.data)"
            exit 1
          }

          $clean_shutdown = $statuses | Where-Object { $_.state -eq "stopped" -and $_.clean_shutdown -eq $true }
          if (-not $clean_shutdown) {
            Write-Error "NativeRelay did not report a clean stopped status"
            exit 1
          }

          Write-Host "Verified complete AgentTrace session and NativeRelay clean shutdown"

          # Cleanup
          Remove-Item -Path $activity_file -ErrorAction SilentlyContinue
          Remove-Item -Path $test_dir -Recurse -Force -ErrorAction SilentlyContinue